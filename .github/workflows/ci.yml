name: CI

on:
  push:
    branches:
      - main
      - feat/quotes-scrapper
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build and test scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run project CI
        run: make ci
